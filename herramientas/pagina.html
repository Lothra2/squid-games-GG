<title>El Juego del Calamar GG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" />
<style>
  /* una sola estética: la pantalla negra y rosada del juego, en cualquier tema */
  :root { --fondo: #0b0a10; --texto: #f4f0e8; --rosa: #e0457b; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #juego { position: fixed; inset: 0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #girar { display: none; position: fixed; inset: 0; z-index: 10; background: var(--fondo); color: var(--texto); font: 16px/1.5 monospace;
    align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 16px; }
  #girar b { color: var(--rosa); font-size: 40px; }
  @media (orientation: portrait) and (max-width: 820px) { #girar { display: flex; } }
</style>
<div id="juego"></div>
<div id="girar"><b>○ △ □</b><p>Gira el teléfono para jugar</p></div>
<script type="module" src="assets/juego.js"></script>
